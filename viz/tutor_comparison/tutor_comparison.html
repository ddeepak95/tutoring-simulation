const HUE = {
  maverick: 'var(--m-maverick)',
  sonnet:   'var(--m-sonnet)',
  grok:     'var(--m-grok)',
  gemini:   'var(--m-gemini)',
};

// Columns are the cross product of the selected tutors and the selected languages, so a language
// is picked the same way a tutor is. `group` decides which of the two varies fastest: ordering by
// tutor puts a model's two languages next to each other, which is the comparison you want when the
// question is "what does this model do differently in Tamil".
//
// Topic is SINGLE-select, deliberately. A row means "the same point in the lesson", and that only
// holds while every column is answering the same question - two topics side by side at row 7 would
// look aligned and not be.
const state = {
  topic: DATA.topics.find(t => t.present > 0).key,
  who: 'both',
  group: 'model',
  models: new Set(DATA.models.map(m => m.key)),
  langs: new Set(DATA.langs.map(l => l.key)),
};

const cellAt = (m, l) => DATA.cells[state.topic + '-' + m.key + '-' + l.key];

// Only columns that actually have a finished run for this topic.
function columns() {
  const ms = DATA.models.filter(m => state.models.has(m.key));
  const ls = DATA.langs.filter(l => state.langs.has(l.key));
  const out = [];
  if (state.group === 'model') {
    for (const m of ms) for (const l of ls) out.push({ m, l });
  } else {
    for (const l of ls) for (const m of ms) out.push({ m, l });
  }
  return out.filter(({ m, l }) => cellAt(m, l));
}

const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

function renderConstants() {
  const f = DATA.fixed, p = f.profile || {};
  const z = f.profileZh || {};
  const rows = [
    ['Student model', f.studentModel.replace(/^vertex_ai\//, '')],
    ['Persona level', f.level + ' (' + f.registry + ')'],
    ['Topic', f.topic],
    ['Length', f.turnsPerSpeaker + ' turns each, ' + (f.turnsPerSpeaker * 2) + ' messages'],
    ['Student — English, Tamil', p.name + ', ' + p.age + ', ' + p.grade + ', ' + p.region],
    ['Student — Mandarin', z.name + ', ' + z.age + ', ' + z.grade + ', ' + z.region],
  ];
  const dl = document.getElementById('constants');
  const boxes = rows.map(([k, v]) => {
    const box = el('div');
    box.append(el('dt', null, k), el('dd', null, v));
    return box;
  });
  dl.replaceChildren(...boxes);
}

function renderMetrics() {
  const body = document.getElementById('metrics');
  const maxReason = Math.max(...Object.values(DATA.cells).map(c => c.reasonTutor), 1);
  const rows = [];
  DATA.langs.forEach((lang, li) => {
    DATA.models.forEach((m, mi) => {
      const c = cellAt(m, lang);
      if (!c) return;
      const tr = el('tr');
      if (li > 0 && mi === 0) tr.className = 'lang-break';
      tr.style.setProperty('--c', HUE[m.key]);

      const nameCell = el('td');
      const flex = el('div', 'cellname');
      flex.append(el('span', 'swatch'), el('span', null, m.name), el('span', 'langtag', lang.name));
      nameCell.append(flex);

      const barCell = el('td');
      const bar = el('div', 'bar');
      if (c.reasonTutor === 0) {
        bar.append(el('span', 'zero', 'none'));
      } else {
        const i = el('i');
        i.style.width = Math.round((c.reasonTutor / maxReason) * 70) + 'px';
        bar.append(el('span', null, c.reasonTutor.toLocaleString()), i);
      }
      barCell.append(bar);

      const u = c.unit === 'chars' ? ' c' : ' w';
      tr.append(
        nameCell,
        el('td', null, c.student),
        el('td', null, c.tutorWpt.toFixed(1) + u),
        el('td', null, c.studentWpt.toFixed(1) + u),
        el('td', null, c.studentMin + '–' + c.studentMax + u),
        barCell,
      );
      rows.push(tr);
    });
  });
  body.replaceChildren(...rows);
}

function segButton(label, pressed, onClick) {
  const b = el('button', null, label);
  b.type = 'button';
  b.setAttribute('aria-pressed', String(pressed));
  b.addEventListener('click', onClick);
  return b;
}

function toggleChip(label, on, hue, onClick) {
  const b = el('button', 'chip');
  b.type = 'button';
  if (hue) b.style.setProperty('--c', hue);
  b.setAttribute('aria-pressed', String(on));
  if (hue) b.append(el('span', 'swatch'));
  b.append(el('span', null, label));
  b.addEventListener('click', onClick);
  return b;
}

function renderControls() {
  // A topic with no finished runs is listed but not selectable, so the set of topics the campaign
  // covers stays visible while it is still filling in.
  const sel = document.getElementById('topicsel');
  sel.replaceChildren(...DATA.topics.map(t => {
    const o = el('option', null, t.present ? t.name : t.name + ' (no runs yet)');
    o.value = t.key;
    o.disabled = !t.present;
    o.selected = state.topic === t.key;
    return o;
  }));
  sel.onchange = () => {
    state.topic = sel.value;
    renderMetrics(); renderQuestion(); renderGrid();
  };

  const whoOpts = [['both', 'Both'], ['tutor', 'Tutor only'], ['student', 'Student only']];
  document.getElementById('whoseg').replaceChildren(...whoOpts.map(([k, label]) =>
    segButton(label, state.who === k, () => {
      state.who = k; renderControls(); renderGrid();
    })));

  const groupOpts = [['model', 'Tutor'], ['lang', 'Language']];
  document.getElementById('groupseg').replaceChildren(...groupOpts.map(([k, label]) =>
    segButton(label, state.group === k, () => {
      state.group = k; renderControls(); renderGrid();
    })));

  document.getElementById('modelchips').replaceChildren(...DATA.models.map(m => {
    const on = state.models.has(m.key);
    return toggleChip(m.name, on, HUE[m.key], () => {
      if (on && state.models.size === 1) return;   // never leave the grid empty
      if (on) state.models.delete(m.key); else state.models.add(m.key);
      renderControls();
      renderGrid();
    });
  }));

  document.getElementById('langchips').replaceChildren(...DATA.langs.map(l => {
    const on = state.langs.has(l.key);
    return toggleChip(l.name, on, null, () => {
      if (on && state.langs.size === 1) return;
      if (on) state.langs.delete(l.key); else state.langs.add(l.key);
      renderControls();
      renderGrid();
    });
  }));
}

function turnBlock(kind, text, len, unit) {
  const t = el('div', 'turn ' + kind);
  const who = el('div', 'who');
  who.append(
    el('span', null, kind === 'tutor' ? 'Tutor' : 'Student'),
    el('span', 'wc', len + (unit === 'chars' ? 'c' : 'w')),
  );
  t.append(who, el('div', 'body', text));
  return t;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const cols = columns();
  const colMin = cols.length > 6 ? 300 : cols.length > 3 ? 340 : 420;
  grid.style.gridTemplateColumns =
    '2.6rem repeat(' + cols.length + ', minmax(' + colMin + 'px, 1fr))';

  const nodes = [el('div', 'corner')];             // empty corner above the row numbers
  for (const { m, l } of cols) {
    const h = el('div', 'colhead lang-' + l.key);
    h.style.setProperty('--c', HUE[m.key]);
    const meta = el('div', 'meta');
    meta.append(el('span', 'vendor', m.vendor), el('span', 'langtag', l.name));
    h.append(el('div', 'name', m.name), meta);
    nodes.push(h);
  }

  const n = Math.max(...cols.map(({ m, l }) => cellAt(m, l).exchanges.length));
  for (let i = 0; i < n; i++) {
    nodes.push(el('div', 'rowno' + (i === 0 ? ' first' : ''), String(i + 1)));
    for (const { m, l } of cols) {
      const ex = cellAt(m, l).exchanges[i];
      const cell = el('div', 'cell' + (i === 0 ? ' first' : ''));
      if (!ex) { cell.style.setProperty('--c', HUE[m.key]); nodes.push(cell); continue; }
      cell.style.setProperty('--c', HUE[m.key]);
      if (state.who !== 'student') cell.append(turnBlock('tutor', ex.tutor, ex.tw, l.unit));
      if (state.who !== 'tutor') cell.append(turnBlock('student', ex.student, ex.sw, l.unit));
      nodes.push(cell);
    }
  }
  grid.replaceChildren(...nodes);
}

// The control bar wraps to two or three lines depending on viewport width, and the scroll pane is
// sized against it. Measured rather than assumed, and re-measured whenever it reflows.
const controlsEl = document.querySelector('.controls');
const syncControlsHeight = () =>
  document.documentElement.style.setProperty('--controls-h', controlsEl.offsetHeight + 'px');

function renderQuestion() {
  const t = DATA.topics.find(x => x.key === state.topic);
  const p = document.getElementById('question');
  p.replaceChildren(el('b', null, 'The question: '), document.createTextNode(t.question));
}

renderConstants();
renderControls();
renderMetrics();
renderQuestion();
renderGrid();

syncControlsHeight();
if (window.ResizeObserver) new ResizeObserver(syncControlsHeight).observe(controlsEl);
else window.addEventListener('resize', syncControlsHeight);
</script>
