[project]
name = "tutoring-check"
version = "0.1.0"
description = "Multilingual explanation collection and quality analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm",
  "python-dotenv",
  "google-auth>=2.56.1",
  "google-cloud-aiplatform>=1.38",
  "beautifulsoup4>=4.12,<5",
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
  "openai>=1,<3",
  "playwright>=1.50,<2",
  "markdownify>=1,<2",
  "requests>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
