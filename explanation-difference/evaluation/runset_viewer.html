<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runset annotation viewer</title><style>body{margin:0;font:14px system-ui;background:#eef0f3;color:#253146}nav{padding:14px 22px;background:white;border-bottom:1px solid #ccd4df;display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:5px}select{padding:7px;max-width:330px;font:inherit}iframe{width:100%;height:calc(100vh - 100px);border:0}#status{margin:0;font-size:12px}</style></head><body><nav><label>Topic<select id="topic"></select></label><label>Model<select id="model"></select></label><label>Response condition<select id="condition"></select></label><p id="status"></p></nav><iframe id="viewer" title="Highlighted explanation" sandbox="allow-scripts allow-modals"></iframe><script id="batch" type="application/json">__BATCH_DATA__</script><script>
const batch=JSON.parse(document.getElementById('batch').textContent),$=id=>document.getElementById(id);
function fill(id,values){const old=$(id).value;$(id).replaceChildren();for(const [value,label] of values){const o=document.createElement('option');o.value=value;o.textContent=label;$(id).append(o)}if(values.some(v=>String(v[0])===old))$(id).value=old}
fill('topic',[...new Set(batch.records.map(r=>r.meta.topic))].map(t=>[t,t]));
function models(){fill('model',[...new Set(batch.records.filter(r=>r.meta.topic===$('topic').value).map(r=>r.meta.model))].map(m=>[m,m]));conditions()}
function conditions(){const names={1:'English prompt / English response',2:'Tamil prompt / Tamil response',3:'English prompt / Tamil response'};fill('condition',batch.records.filter(r=>r.meta.topic===$('topic').value&&r.meta.model===$('model').value).map(r=>[r.meta.condition,names[r.meta.condition]]));show()}
function show(){const r=batch.records.find(r=>r.meta.topic===$('topic').value&&r.meta.model===$('model').value&&String(r.meta.condition)===$('condition').value);if(!r)return;const payload=JSON.stringify(r.record).replaceAll('<','\\u003c').replaceAll('>','\\u003e').replaceAll('&','\\u0026');$('viewer').srcdoc=batch.template.replace('__ANNOTATION_DATA__',()=>payload);$('status').textContent=batch.records.length+' evaluated responses · '+r.record.evaluation.content_units.length+' content units'}
$('topic').onchange=models;$('model').onchange=conditions;$('condition').onchange=show;models();
</script></body></html>
